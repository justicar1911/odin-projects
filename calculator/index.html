<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator Project</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./index.js"></script>
  </head>
  <body>
    <div class="calculator">
      <div class="display">
        <input type="text" id="display-input" disabled />
      </div>
      <div class="buttons">
        <button type="button" value="7">7</button>
        <button type="button" value="8">8</button>
        <button type="button" value="9">9</button>
        <button class="operator" type="button" value="/">/</button>
        <button type="button" value="4">4</button>
        <button type="button" value="5">5</button>
        <button type="button" value="6">6</button>
        <button class="operator" type="button" value="+">+</button>
        <button type="button" value="1">1</button>
        <button type="button" value="2">2</button>
        <button type="button" value="3">3</button>
        <button class="operator" type="button" value="-">-</button>
        <button type="button" value="0">0</button>
        <button id="dot" type="button" value=".">.</button>
        <button class="operator" type="button" value="*">*</button>
        <button class="operator" type="button" value="=" id="equal">=</button>
        <button id="clear" type="button">Clear</button>
      </div>
      <button id="test" type="button">console.log</button>
    </div>
  </body>
</html>
